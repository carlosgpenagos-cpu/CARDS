<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prototipo AR - Poemas</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        
        #interfaz-poema {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 500;
            border-left: 5px solid #000;
            z-index: 999;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.15);
            display: none; /* Oculto hasta que detecte una carta */
        }
    </style>
</head>

<body>
    <div id="interfaz-poema">Buscando cartas...</div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <!-- CARTAS (Sin modelos 3D, solo detectores) -->
        <a-nft detector-cartas="numero: 1" type="nft" url="marcadores/carta1" id="carta-1" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"></a-nft>
        <a-nft detector-cartas="numero: 2" type="nft" url="marcadores/carta2" id="carta-2" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"></a-nft>
        <a-nft detector-cartas="numero: 3" type="nft" url="marcadores/carta3" id="carta-3" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"></a-nft>
        <a-nft detector-cartas="numero: 4" type="nft" url="marcadores/carta4" id="carta-4" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"></a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="script.js"></script>
</body>
</html>
